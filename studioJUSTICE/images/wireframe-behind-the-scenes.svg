<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" width="1200" height="2400">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .label { font-size: 11px; fill: #999; text-anchor: middle; }
      .heading { font-size: 18px; fill: #333; font-weight: 600; }
      .subhead { font-size: 13px; fill: #666; }
      .small { font-size: 10px; fill: #aaa; text-anchor: middle; }
      .section-label { font-size: 10px; fill: #999; letter-spacing: 2px; text-transform: uppercase; }
      .title { font-size: 28px; fill: #222; font-weight: 700; }
      .body-text { font-size: 11px; fill: #888; }
      .annotation { font-size: 10px; fill: #c44; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="2400" fill="#f5f5f5" rx="8"/>

  <!-- Page title annotation -->
  <text x="600" y="30" font-size="14" fill="#c44" text-anchor="middle" font-weight="600">WIREFRAME — Studio Justice: Behind the Scenes (Page 2)</text>

  <!-- ========== NAV BAR ========== -->
  <rect x="0" y="50" width="1200" height="70" fill="#1a1a1a" rx="0"/>
  <!-- Logo placeholder -->
  <rect x="40" y="62" width="120" height="46" fill="#333" rx="4"/>
  <text x="100" y="90" class="small" fill="#888">LOGO</text>
  <!-- Nav links -->
  <text x="700" y="90" font-size="13" fill="#ccc" font-family="Helvetica Neue, Arial, sans-serif">Work</text>
  <text x="790" y="90" font-size="13" fill="#ccc" font-family="Helvetica Neue, Arial, sans-serif">About</text>
  <text x="890" y="90" font-size="13" fill="#ccc" font-family="Helvetica Neue, Arial, sans-serif">Services</text>
  <text x="990" y="90" font-size="13" fill="#fff" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-decoration="underline">BTS</text>
  <text x="1090" y="90" font-size="13" fill="#ccc" font-family="Helvetica Neue, Arial, sans-serif">Contact</text>

  <!-- ========== HERO / PAGE HEADER ========== -->
  <rect x="0" y="120" width="1200" height="340" fill="#222"/>
  <!-- Large hero image placeholder -->
  <rect x="60" y="145" width="500" height="290" fill="#333" rx="4"/>
  <line x1="60" y1="145" x2="560" y2="435" stroke="#555" stroke-width="0.5"/>
  <line x1="560" y1="145" x2="60" y2="435" stroke="#555" stroke-width="0.5"/>
  <text x="310" y="295" class="label" fill="#777">Hero Image — BTS Photo</text>

  <!-- Hero text overlay -->
  <text x="640" y="210" font-size="11" fill="#888" letter-spacing="3" font-family="Helvetica Neue, Arial, sans-serif">THE PROCESS</text>
  <text x="640" y="260" font-size="36" fill="#fff" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">Behind the</text>
  <text x="640" y="305" font-size="36" fill="#fff" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">Scenes</text>
  <text x="640" y="345" font-size="13" fill="#999" font-family="Helvetica Neue, Arial, sans-serif">A look at how we bring stories to life —</text>
  <text x="640" y="365" font-size="13" fill="#999" font-family="Helvetica Neue, Arial, sans-serif">from concept to final cut.</text>
  <rect x="640" y="390" width="140" height="36" fill="none" stroke="#888" stroke-width="1" rx="18"/>
  <text x="710" y="413" font-size="12" fill="#ccc" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif">Watch Reel ▶</text>

  <!-- ========== SECTION 1: PROCESS STEPS ========== -->
  <rect x="0" y="460" width="1200" height="460" fill="#fafafa"/>
  <text x="600" y="510" class="section-label" text-anchor="middle">HOW IT WORKS</text>
  <text x="600" y="545" class="title" text-anchor="middle">Our Process</text>

  <!-- Step 1 -->
  <rect x="80" y="580" width="230" height="300" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <circle cx="195" cy="620" r="22" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="195" y="627" font-size="16" fill="#333" text-anchor="middle" font-weight="600">01</text>
  <text x="195" y="670" font-size="15" fill="#333" text-anchor="middle" font-weight="600">Discovery</text>
  <rect x="110" y="690" width="170" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="120" y="708" width="150" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="115" y="726" width="160" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="125" y="744" width="140" height="8" fill="#e5e5e5" rx="4"/>
  <text x="195" y="786" class="small">Concept &amp; vision meeting</text>

  <!-- Step 2 -->
  <rect x="350" y="580" width="230" height="300" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <circle cx="465" cy="620" r="22" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="465" y="627" font-size="16" fill="#333" text-anchor="middle" font-weight="600">02</text>
  <text x="465" y="670" font-size="15" fill="#333" text-anchor="middle" font-weight="600">Pre-Production</text>
  <rect x="380" y="690" width="170" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="390" y="708" width="150" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="385" y="726" width="160" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="395" y="744" width="140" height="8" fill="#e5e5e5" rx="4"/>
  <text x="465" y="786" class="small">Storyboard, scout, plan</text>

  <!-- Step 3 -->
  <rect x="620" y="580" width="230" height="300" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <circle cx="735" cy="620" r="22" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="735" y="627" font-size="16" fill="#333" text-anchor="middle" font-weight="600">03</text>
  <text x="735" y="670" font-size="15" fill="#333" text-anchor="middle" font-weight="600">Production</text>
  <rect x="650" y="690" width="170" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="660" y="708" width="150" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="655" y="726" width="160" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="665" y="744" width="140" height="8" fill="#e5e5e5" rx="4"/>
  <text x="735" y="786" class="small">Lights, camera, action</text>

  <!-- Step 4 -->
  <rect x="890" y="580" width="230" height="300" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="6"/>
  <circle cx="1005" cy="620" r="22" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="1005" y="627" font-size="16" fill="#333" text-anchor="middle" font-weight="600">04</text>
  <text x="1005" y="670" font-size="15" fill="#333" text-anchor="middle" font-weight="600">Post &amp; Delivery</text>
  <rect x="920" y="690" width="170" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="930" y="708" width="150" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="925" y="726" width="160" height="8" fill="#e5e5e5" rx="4"/>
  <rect x="935" y="744" width="140" height="8" fill="#e5e5e5" rx="4"/>
  <text x="1005" y="786" class="small">Edit, color, sound, deliver</text>

  <!-- ========== SECTION 2: BTS PHOTO GALLERY ========== -->
  <rect x="0" y="920" width="1200" height="580" fill="#1a1a1a"/>
  <text x="600" y="975" font-size="10" fill="#888" letter-spacing="3" text-anchor="middle">ON SET</text>
  <text x="600" y="1010" font-size="28" fill="#fff" text-anchor="middle" font-weight="700">Behind the Lens</text>

  <!-- Row 1: 3 images -->
  <rect x="80" y="1045" width="340" height="220" fill="#333" rx="4"/>
  <line x1="80" y1="1045" x2="420" y2="1265" stroke="#555" stroke-width="0.5"/>
  <line x1="420" y1="1045" x2="80" y2="1265" stroke="#555" stroke-width="0.5"/>
  <text x="250" y="1160" class="label" fill="#777">BTS Photo 1</text>

  <rect x="440" y="1045" width="320" height="220" fill="#333" rx="4"/>
  <line x1="440" y1="1045" x2="760" y2="1265" stroke="#555" stroke-width="0.5"/>
  <line x1="760" y1="1045" x2="440" y2="1265" stroke="#555" stroke-width="0.5"/>
  <text x="600" y="1160" class="label" fill="#777">BTS Photo 2</text>

  <rect x="780" y="1045" width="340" height="220" fill="#333" rx="4"/>
  <line x1="780" y1="1045" x2="1120" y2="1265" stroke="#555" stroke-width="0.5"/>
  <line x1="1120" y1="1045" x2="780" y2="1265" stroke="#555" stroke-width="0.5"/>
  <text x="950" y="1160" class="label" fill="#777">BTS Photo 3</text>

  <!-- Row 2: 2 images -->
  <rect x="80" y="1285" width="520" height="190" fill="#333" rx="4"/>
  <line x1="80" y1="1285" x2="600" y2="1475" stroke="#555" stroke-width="0.5"/>
  <line x1="600" y1="1285" x2="80" y2="1475" stroke="#555" stroke-width="0.5"/>
  <text x="340" y="1385" class="label" fill="#777">BTS Photo 4</text>

  <rect x="620" y="1285" width="500" height="190" fill="#333" rx="4"/>
  <line x1="620" y1="1285" x2="1120" y2="1475" stroke="#555" stroke-width="0.5"/>
  <line x1="1120" y1="1285" x2="620" y2="1475" stroke="#555" stroke-width="0.5"/>
  <text x="870" y="1385" class="label" fill="#777">BTS Photo 5</text>

  <!-- ========== SECTION 3: GEAR / TOOLKIT ========== -->
  <rect x="0" y="1500" width="1200" height="420" fill="#f5f5f5"/>
  <text x="600" y="1555" font-size="10" fill="#999" letter-spacing="3" text-anchor="middle">EQUIPMENT</text>
  <text x="600" y="1590" font-size="28" fill="#222" text-anchor="middle" font-weight="700">The Toolkit</text>

  <!-- Gear image left -->
  <rect x="80" y="1620" width="460" height="270" fill="#ddd" rx="4"/>
  <line x1="80" y1="1620" x2="540" y2="1890" stroke="#ccc" stroke-width="0.5"/>
  <line x1="540" y1="1620" x2="80" y2="1890" stroke="#ccc" stroke-width="0.5"/>
  <text x="310" y="1760" class="label" fill="#aaa">Gear / Setup Image</text>

  <!-- Text right -->
  <text x="600" y="1660" font-size="15" fill="#333" font-weight="600">Camera &amp; Lenses</text>
  <rect x="600" y="1675" width="500" height="8" fill="#e0e0e0" rx="4"/>
  <rect x="600" y="1693" width="460" height="8" fill="#e0e0e0" rx="4"/>
  <rect x="600" y="1711" width="480" height="8" fill="#e0e0e0" rx="4"/>

  <text x="600" y="1760" font-size="15" fill="#333" font-weight="600">Lighting &amp; Audio</text>
  <rect x="600" y="1775" width="500" height="8" fill="#e0e0e0" rx="4"/>
  <rect x="600" y="1793" width="440" height="8" fill="#e0e0e0" rx="4"/>
  <rect x="600" y="1811" width="470" height="8" fill="#e0e0e0" rx="4"/>

  <text x="600" y="1860" font-size="15" fill="#333" font-weight="600">Post-Production Software</text>
  <rect x="600" y="1875" width="480" height="8" fill="#e0e0e0" rx="4"/>
  <rect x="600" y="1893" width="450" height="8" fill="#e0e0e0" rx="4"/>

  <!-- ========== SECTION 4: CTA ========== -->
  <rect x="0" y="1920" width="1200" height="240" fill="#222"/>
  <text x="600" y="2000" font-size="11" fill="#888" letter-spacing="3" text-anchor="middle">READY TO START?</text>
  <text x="600" y="2050" font-size="30" fill="#fff" text-anchor="middle" font-weight="700">Let's build your story.</text>
  <rect x="500" y="2080" width="200" height="44" fill="none" stroke="#fff" stroke-width="1" rx="22"/>
  <text x="600" y="2107" font-size="13" fill="#fff" text-anchor="middle">Get in Touch →</text>

  <!-- ========== FOOTER ========== -->
  <rect x="0" y="2160" width="1200" height="130" fill="#111"/>
  <rect x="530" y="2180" width="140" height="45" fill="#333" rx="4"/>
  <text x="600" y="2207" class="small" fill="#888">LOGO</text>
  <!-- Social icons placeholders -->
  <circle cx="555" cy="2250" r="14" fill="none" stroke="#555" stroke-width="1"/>
  <text x="555" y="2254" font-size="8" fill="#888" text-anchor="middle">IG</text>
  <circle cx="600" cy="2250" r="14" fill="none" stroke="#555" stroke-width="1"/>
  <text x="600" y="2254" font-size="8" fill="#888" text-anchor="middle">VM</text>
  <circle cx="645" cy="2250" r="14" fill="none" stroke="#555" stroke-width="1"/>
  <text x="645" y="2254" font-size="8" fill="#888" text-anchor="middle">YT</text>
  <text x="600" y="2280" font-size="10" fill="#666" text-anchor="middle">© 2026 Studio Justice. All rights reserved.</text>

  <!-- ========== ANNOTATIONS ========== -->
  <!-- Dashed section dividers with labels -->
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#c44" stroke-width="0.5" stroke-dasharray="6,4"/>
  <line x1="0" y1="920" x2="1200" y2="920" stroke="#c44" stroke-width="0.5" stroke-dasharray="6,4"/>
  <line x1="0" y1="1500" x2="1200" y2="1500" stroke="#c44" stroke-width="0.5" stroke-dasharray="6,4"/>
  <line x1="0" y1="1920" x2="1200" y2="1920" stroke="#c44" stroke-width="0.5" stroke-dasharray="6,4"/>
  <line x1="0" y1="2160" x2="1200" y2="2160" stroke="#c44" stroke-width="0.5" stroke-dasharray="6,4"/>

</svg>