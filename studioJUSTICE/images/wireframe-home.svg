<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2200" width="800" height="2200">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .label { font-size: 11px; fill: #999; font-weight: 400; }
    .heading { font-size: 14px; fill: #333; font-weight: 700; }
    .small { font-size: 10px; fill: #aaa; }
  </style>

  <!-- Background -->
  <rect width="800" height="2200" fill="#fff" rx="4"/>

  <!-- ===== NAV ===== -->
  <rect x="0" y="0" width="800" height="56" fill="#1a1a1a"/>
  <rect x="24" y="16" width="80" height="24" rx="3" fill="#333" stroke="#555" stroke-width="0.5"/>
  <text x="44" y="32" class="small" fill="#ccc">Logo</text>
  <rect x="450" y="20" width="40" height="12" rx="2" fill="#444"/>
  <rect x="510" y="20" width="40" height="12" rx="2" fill="#444"/>
  <rect x="570" y="20" width="80" height="12" rx="2" fill="#444"/>
  <rect x="670" y="20" width="50" height="12" rx="2" fill="#444"/>
  <rect x="740" y="20" width="40" height="12" rx="2" fill="#444"/>

  <!-- ===== HERO (full-screen video) ===== -->
  <rect x="0" y="56" width="800" height="500" fill="#111"/>
  <!-- Play icon center -->
  <circle cx="400" cy="280" r="30" fill="none" stroke="#555" stroke-width="1.5"/>
  <polygon points="390,265 418,280 390,295" fill="#555"/>
  <text x="400" y="340" text-anchor="middle" class="label" fill="#666">Full-Screen Video Hero</text>
  <!-- Hero text overlay -->
  <text x="60" y="480" font-size="10" fill="#666" letter-spacing="3">VISUAL STORYTELLING PORTFOLIO</text>
  <text x="60" y="510" font-size="22" fill="#ccc" font-weight="300">By Hudson Lee</text>
  <!-- Scroll indicator -->
  <text x="760" y="520" text-anchor="end" font-size="9" fill="#555">Scroll ↓</text>
  <!-- Side label -->
  <text x="20" y="320" font-size="8" fill="#444" transform="rotate(-90 20 320)">Videography · Film · Photography</text>

  <!-- ===== SECTION: PORTFOLIO / WORK ===== -->
  <rect x="0" y="556" width="800" height="680" fill="#fafafa"/>
  <text x="60" y="600" font-size="10" fill="#bbb" letter-spacing="2">SELECTED WORK</text>
  <text x="60" y="625" class="heading" font-size="20">Portfolio</text>

  <!-- Filter bar -->
  <rect x="60" y="645" width="36" height="18" rx="9" fill="#333"/>
  <text x="68" y="658" font-size="8" fill="#fff">All</text>
  <rect x="106" y="645" width="56" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="114" y="658" font-size="8" fill="#999">Youtube</text>
  <rect x="172" y="645" width="72" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="180" y="658" font-size="8" fill="#999">Documentary</text>
  <rect x="254" y="645" width="72" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="262" y="658" font-size="8" fill="#999">Commercial</text>
  <rect x="336" y="645" width="60" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="344" y="658" font-size="8" fill="#999">Narrative</text>
  <rect x="406" y="645" width="56" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="414" y="658" font-size="8" fill="#999">Wedding</text>
  <rect x="472" y="645" width="46" height="18" rx="9" fill="none" stroke="#ccc" stroke-width="0.7"/>
  <text x="480" y="658" font-size="8" fill="#999">Event</text>

  <!-- Asymmetric project grid row 1 -->
  <rect x="60" y="680" width="440" height="260" rx="4" fill="#ddd"/>
  <text x="280" y="818" text-anchor="middle" class="label">Large Card — Music Video</text>
  <rect x="520" y="680" width="220" height="125" rx="4" fill="#ddd"/>
  <text x="630" y="748" text-anchor="middle" class="small">Small — Documentary</text>
  <rect x="520" y="815" width="220" height="125" rx="4" fill="#ddd"/>
  <text x="630" y="883" text-anchor="middle" class="small">Small — Commercial</text>

  <!-- Asymmetric project grid row 2 -->
  <rect x="60" y="955" width="220" height="125" rx="4" fill="#ddd"/>
  <text x="170" y="1023" text-anchor="middle" class="small">Small — Wedding</text>
  <rect x="300" y="955" width="220" height="125" rx="4" fill="#ddd"/>
  <text x="410" y="1023" text-anchor="middle" class="small">Small — Youtube</text>
  <rect x="540" y="955" width="200" height="260" rx="4" fill="#ddd"/>
  <text x="640" y="1093" text-anchor="middle" class="label">Large — Event Video</text>

