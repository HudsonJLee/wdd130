  <line x1="60" y1="1710" x2="740" y2="1710" stroke="#eee" stroke-width="1"/>
  <text x="60" y="1732" font-size="12" fill="#aaa">01</text>
  <text x="100" y="1732" font-size="12" fill="#333" font-weight="600">Music Video Production</text>
  <text x="700" y="1732" font-size="10" fill="#999">Inquire →</text>

  <line x1="60" y1="1745" x2="740" y2="1745" stroke="#eee" stroke-width="1"/>
  <text x="60" y="1767" font-size="12" fill="#aaa">02</text>
  <text x="100" y="1767" font-size="12" fill="#333" font-weight="600">Documentary Filmmaking</text>
  <text x="700" y="1767" font-size="10" fill="#999">Inquire →</text>

  <line x1="60" y1="1780" x2="740" y2="1780" stroke="#eee" stroke-width="1"/>
  <text x="60" y="1802" font-size="12" fill="#aaa">03</text>
  <text x="100" y="1802" font-size="12" fill="#333" font-weight="600">Commercial &amp; Brand Content</text>
  <text x="700" y="1802" font-size="10" fill="#999">Inquire →</text>

  <line x1="60" y1="1815" x2="740" y2="1815" stroke="#eee" stroke-width="1"/>
  <text x="60" y="1837" font-size="12" fill="#aaa">04</text>
  <text x="100" y="1837" font-size="12" fill="#333" font-weight="600">Narrative &amp; Short Film</text>
  <text x="700" y="1837" font-size="10" fill="#999">Inquire →</text>

  <line x1="60" y1="1850" x2="740" y2="1850" stroke="#eee" stroke-width="1"/>
  <text x="60" y="1872" font-size="12" fill="#aaa">05</text>
  <text x="100" y="1872" font-size="12" fill="#333" font-weight="600">Wedding Videography</text>
  <text x="700" y="1872" font-size="10" fill="#999">Inquire →</text>
  <line x1="60" y1="1885" x2="740" y2="1885" stroke="#eee" stroke-width="1"/>

