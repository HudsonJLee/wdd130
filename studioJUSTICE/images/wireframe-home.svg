  <text x="60" y="1310" class="heading" font-size="20">Hudson Lee</text>

  <!-- Two-column: text left, image right -->
  <rect x="60" y="1330" width="360" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1352" width="340" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1374" width="350" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1396" width="320" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1418" width="360" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1440" width="300" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1462" width="340" height="14" rx="2" fill="#ccc"/>
  <rect x="60" y="1484" width="280" height="14" rx="2" fill="#ccc"/>

  <!-- Portrait image -->
  <rect x="490" y="1290" width="250" height="300" rx="4" fill="#ddd"/>
  <text x="615" y="1445" text-anchor="middle" class="label">Portrait Image</text>

