  <text x="60" y="2050" font-size="9" fill="#555">Phoenix, AZ · Available Worldwide</text>
  <!-- Social icons -->
  <circle cx="70" cy="2075" r="10" fill="none" stroke="#444" stroke-width="0.8"/>
  <circle cx="100" cy="2075" r="10" fill="none" stroke="#444" stroke-width="0.8"/>
  <circle cx="130" cy="2075" r="10" fill="none" stroke="#444" stroke-width="0.8"/>

  <!-- Contact form right -->
  <rect x="420" y="2000" width="150" height="24" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <text x="430" y="2016" font-size="8" fill="#666">Name</text>
  <rect x="580" y="2000" width="150" height="24" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <text x="590" y="2016" font-size="8" fill="#666">Email</text>
  <rect x="420" y="2032" width="310" height="24" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <text x="430" y="2048" font-size="8" fill="#666">Project Type</text>
  <rect x="420" y="2064" width="310" height="48" rx="3" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <text x="430" y="2084" font-size="8" fill="#666">Message</text>
  <rect x="420" y="2120" width="100" height="26" rx="3" fill="#f5f3ef"/>
  <text x="445" y="2137" font-size="9" fill="#1a1a1a" font-weight="600">Send Message</text>

  <!-- ===== FOOTER ===== -->
  <rect x="0" y="2146" width="800" height="54" fill="#111"/>
  <rect x="340" y="2156" width="120" height="14" rx="2" fill="#222"/>
  <text x="400" y="2190" text-anchor="middle" font-size="8" fill="#444">© 2026 Studio Justice. All rights reserved.</text>
</svg>
