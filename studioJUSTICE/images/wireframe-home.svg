  <rect x="0" y="1616" width="800" height="310" fill="#fff"/>
  <text x="60" y="1660" font-size="10" fill="#bbb" letter-spacing="2">WHAT WE DO</text>
  <text x="60" y="1688" class="heading" font-size="20">Services</text>

