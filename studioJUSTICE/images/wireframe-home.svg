  <rect x="0" y="1926" width="800" height="220" fill="#1a1a1a"/>
  <text x="60" y="1960" font-size="10" fill="#555" letter-spacing="2">GET IN TOUCH</text>
  <text x="60" y="1995" font-size="24" fill="#f5f3ef" font-weight="300" font-style="italic">Let's create something together.</text>

